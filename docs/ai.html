<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подбор с ИИ — Дарлу</title>
<meta name="description" content="Сервис необычных подарков от небольших творческих брендов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="splash.js"></script>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="index.html" aria-label="Дарлу">
      <svg viewBox="0 0 48 48" class="logo-mark" aria-hidden="true"><use href="#gift"/></svg>
      <span class="logo-txt"><b>Дарлу</b><small>дар быть особенным</small></span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <a href="ai.html" class="on">Подбор с ИИ</a>
      <a href="catalog.html">Каталог</a>
      <a href="#">Сообщество</a>
      <a href="#">Обратная связь</a>
      <a href="brands.html">Брендам</a>
      <a href="about.html">О нас</a>
    </nav>
    <div class="hdr-r">
      <a class="icon-btn" href="account.html#fav" aria-label="Избранное" data-auth="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg><span class="badge" hidden>0</span></a>
      <a class="icon-btn" href="account.html" aria-label="Личный кабинет" data-auth="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></a>
      <a class="btn btn-coral" href="ai.html">Подобрать подарок</a>
    </div>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="gift" viewBox="0 0 48 48">
    <rect x="8" y="22" width="32" height="20" rx="4" fill="#F4A8A0"/>
    <rect x="6" y="16" width="36" height="9" rx="4" fill="#F7B9B2"/>
    <rect x="21" y="16" width="6" height="26" rx="2" fill="#E98A82"/>
    <path d="M24 16C16 15 11 9 14 6c3-3 8 0 10 10 2-10 7-13 10-10 3 3-2 9-10 10z" fill="#E98A82"/>
  </symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<main class="ai">
  <div class="ai-wrap">
    <div class="ai-head">
      <span class="ai-ava"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M12 9C9 9 7 7.500 8 5.800c1-1.600 3.400-.4 4 3.200.6-3.600 3-4.800 4-3.200 1 1.700-1 3.200-4 3.200z"/></svg></span>
      <div class="ai-ttl"><h1>ИИ-помощник Дарлу</h1><small id="stepLabel">Шаг 1 из 13</small></div>
      <button class="again" id="restart" type="button">Заново</button>
    </div>
    <div class="ai-bar"><i id="prog"></i></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="answers" id="answers"></div>
    <section class="results" id="results"></section>
  </div>
</main>
<script src="products.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="ai.js"></script>
</body>
</html>
